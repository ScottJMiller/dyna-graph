[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    lan: requires both physical Ollama nodes and explicit --run-lan
    storage_benchmark: requires explicit --run-storage-benchmark; tests committed insert latency
    retrieval_benchmark: requires explicit --run-retrieval-benchmark; tests warm context assembly latency
    both_nodes: requires both physical Ollama nodes; cannot run with partial --lan-node selection
